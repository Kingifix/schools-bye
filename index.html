<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f10" />
    <title>schools.bye</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header id="app-header">
      <span class="title-name">schools.bye</span>
      <button id="title-btn" class="title-btn" aria-haspopup="true" aria-expanded="false">
        <span id="view-label" class="view-label"></span>
        <svg class="chevron" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div id="progress-bar" class="progress-bar"></div>
    </header>

    <button id="update-banner" class="update-banner" hidden></button>

    <div id="menu-backdrop" class="menu-backdrop"></div>
    <nav id="view-menu" class="view-menu" role="menu"></nav>

    <main>
      <section id="schedule-view">
        <div id="schedule"></div>
        <div class="page-foot">
          <button id="settings-btn" class="foot-btn" aria-label="Настройки">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <button id="logout-btn" class="foot-btn" aria-label="Выйти">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </section>

      <section id="final-view" hidden>
        <div class="final-toolbar">
          <p id="final-status" class="final-status"></p>
          <button id="final-goal" class="final-reload final-goal">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
            <span id="goal-label">Цель</span>
          </button>
          <button id="final-reload" class="final-reload">
            <img src="/src/assets/icons/refresh.svg" alt="" />
            <span>Пересчитать</span>
          </button>
        </div>
        <h2 id="current-title" class="section-title"></h2>
        <div id="current-wrap"></div>
        <h2 class="section-title">Итоговые</h2>
        <div id="final-table-wrap" class="final-table-wrap"></div>
        <p class="final-legend">
          <span class="legend-chip">8.40</span> — учитель ещё не выставил: среднее по отметкам за недели или прогноз schools.by
        </p>
      </section>
    </main>

    <div id="login-modal" class="login-modal hidden">
      <form class="login-box" id="login-form">
        <img src="/src/assets/logo.svg" class="login-logo" alt="" />
        <h2>вход в schools.by</h2>
        <input type="text" id="login-username" placeholder="логин" autocomplete="username" autocapitalize="off" />
        <input type="password" id="login-password" placeholder="пароль" autocomplete="current-password" />
        <button type="submit" id="login-submit">войти</button>
        <p id="login-error" class="login-error"></p>
      </form>
    </div>

    <div id="sheet-backdrop" class="menu-backdrop"></div>
    <div id="sheet" class="sheet"></div>
    <div id="toast" class="toast"></div>
    <div id="scroll-thumb" class="scroll-thumb"></div>

    <div id="week-nav">
      <button id="marks-btn" class="nav-btn" aria-label="Новые отметки">
        <img src="/src/assets/icons/bell.svg" alt="" />
      </button>
      <button id="prev-week" class="nav-btn" aria-label="Предыдущая неделя">
        <img src="/src/assets/icons/arrow-left.svg" alt="" />
      </button>
      <button id="reload-pill" class="nav-btn" aria-label="Обновить">
        <img src="/src/assets/icons/refresh.svg" alt="" />
      </button>
      <button id="next-week" class="nav-btn" aria-label="Следующая неделя">
        <img src="/src/assets/icons/arrow-right.svg" alt="" />
      </button>
    </div>
  </body>
</html>
